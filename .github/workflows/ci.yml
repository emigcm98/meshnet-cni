name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make test
      - run: make test-root

  # The three-node topology on a kind of two workers, so the links cover a veth and a vxlan.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make up
      - run: make docker
      - run: make install
      - run: make e2e
      - run: make eviction
      - run: make live-links
      - run: make off-links
      - run: make declared
      - run: make shaping
      - run: make status
