name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: sudo apt-get install -y libpcap-dev
      - run: make lint
      - run: make test

  # The three-node topology on a kind of two workers, so the links cover a veth and vxlan or grpc wires.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        link: [vxlan, grpc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make up
      - run: make docker
      - run: make install
        if: matrix.link == 'vxlan'
      - run: make grpc=1 install
        if: matrix.link == 'grpc'
      - run: make e2e
