syntax = "proto3";

package meshnet.v1beta1;

option go_package = "github.com/emigcm98/meshnet-cni/daemon/proto/meshnet/v1beta1";

message Pod {
  string name = 1;
  string src_ip = 2;
  string net_ns = 3;
  string kube_ns = 4;
  repeated Link links = 5;
  string node_ip = 6;
  string node_intf = 7;
  string container_id = 8;
}

message Link {
  string peer_pod = 1;
  string local_intf = 2;
  string peer_intf = 3;
  string local_ip = 4;
  string peer_ip = 5;
  int64 uid = 6;
}

message PodQuery {
  string name = 1;
  string kube_ns = 2;
}

message BoolResponse {
  bool response = 1;
}

service Local {
  rpc Get (PodQuery) returns (Pod);
  rpc SetAlive (Pod) returns (BoolResponse);
}
